# Clause taxonomy — Educational Affiliation Agreement
# Derived from CUAD v1 (41 categories) + custom entries for this agreement type.
# Curation rule: prune by setting status: inactive (never delete), so a future CUAD
# upgrade can be merged without losing these choices. status: custom = our addition.
#
# Attribution: category names/descriptions derived from CUAD v1, created by
# The Atticus Project (https://www.atticusprojectai.org/cuad), licensed under
# CC-BY-4.0 (https://creativecommons.org/licenses/by/4.0/). See NOTICE.
source: CUAD-v1

entries:
  # --- Active: present/material in affiliation agreements ---
  # structural: true (issue #106) — the reported case: on a real
  # 43-document corpus this entry alone produced 54 reversal citations,
  # none of it a real negotiating position. Reviewer gate: in an NDA,
  # mutual-vs-one-way framing on this same clause CAN be substantive —
  # re-litigate this marking per agreement type before trusting it blindly.
  - { id: parties_and_recitals,      label: "Parties & Recitals",            status: active, cuad_origin: Parties,                       description: "Who is bound; the Institution/Company/Student framing.", structural: true }
  - { id: term,                      label: "Term",                          status: active, cuad_origin: "Expiration Date",              description: "Initial term and effective date." }
  - { id: renewal_term,              label: "Renewal / Auto-Renewal",        status: active, cuad_origin: "Renewal Term",                 description: "Whether and how the agreement renews." }
  - { id: termination_convenience,   label: "Termination for Convenience",   status: active, cuad_origin: "Termination For Convenience",   description: "Non-renewal / no-fault exit and notice period." }
  - { id: termination_cause,         label: "Termination for Cause",         status: active, cuad_origin: null,                          description: "Breach, cure period, immediate termination triggers. Not what survives termination (see survival)." }
  - { id: indemnification,           label: "Indemnification",               status: active, cuad_origin: null,                          description: "Who bears third-party claim risk; mutual vs one-way." }
  - { id: insurance,                 label: "Insurance",                     status: active, cuad_origin: Insurance,                     description: "Required coverage types and limits; student health insurance." }
  - { id: governing_law,             label: "Governing Law",                 status: active, cuad_origin: "Governing Law",                description: "Which state's law governs." }
  - { id: assignment,                label: "Assignment",                    status: active, cuad_origin: "Anti-Assignment",              description: "A party's transfer of the agreement, or of its rights and obligations, to another entity: consent to assign, change of control, affiliate and merger carve-outs. Not the assignment or placement of students to sites or programs (see supervision_evaluation and program_administration)." }
  - { id: confidentiality,           label: "Confidentiality",               status: active, cuad_origin: null,                          description: "Confidential Information definition and obligations." }
  - { id: ferpa_student_records,     label: "FERPA / Student Records",       status: active, cuad_origin: null,                          description: "Handling of education records under FERPA." }
  - { id: hipaa_phi,                 label: "HIPAA / PHI",                   status: active, cuad_origin: null,                          description: "Protected health information; business-associate status." }
  - { id: data_privacy_security,     label: "Data Privacy & Security",       status: active, cuad_origin: null,                          description: "Data protection beyond FERPA/HIPAA." }
  - { id: background_checks,         label: "Background Checks",             status: active, cuad_origin: null,                          description: "Right to screen students before placement: criminal, drug and identity screening, and the host's right to refuse a student on a screening result. Immunizations and other health clearance belong to student_health_and_safety, and refusal on other grounds to student_access_and_removal." }
  - { id: supervision_evaluation,    label: "Supervision & Evaluation",      status: active, cuad_origin: null,                          description: "Coordinators, day-to-day supervision, student evaluation and grading. Not the host's right to refuse or remove a student (see student_access_and_removal) or its operating terms and joint program review (see program_administration)." }
  - { id: student_responsibilities,  label: "Student Responsibilities",      status: active, cuad_origin: null,                          description: "A student's own conduct duties: conduct, timeliness, uniforms, confidentiality. Not emergency care for an injured student (see student_health_and_safety)." }
  - { id: relationship_of_parties,   label: "Relationship of Parties",       status: active, cuad_origin: null,                          description: "No employment/partnership; students not employees; a statement that the parties may deal with others (non-exclusivity)." }
  - { id: non_discrimination,        label: "Non-Discrimination",            status: active, cuad_origin: null,                          description: "Anti-discrimination obligations." }
  - { id: remuneration,              label: "Remuneration / No-Pay",         status: active, cuad_origin: null,        description: "Whether students are paid; no-payment-between-parties." }
  - { id: notices,                   label: "Notices",                       status: active, cuad_origin: null, description: "Notice addresses and method." }
  - { id: severability,              label: "Severability",                  status: active, cuad_origin: null,                          description: "Severance of an invalid or unenforceable provision so the rest of the agreement continues in force. Not what continues after expiry or termination (see survival)." }
  - { id: entire_agreement,          label: "Entire Agreement",              status: active, cuad_origin: null,                          description: "Integration / merger clause." }
  - { id: amendments,                label: "Amendments",                    status: active, cuad_origin: null,                          description: "How the agreement may be modified." }
  - { id: accreditation_licensure,   label: "Accreditation & Licensure",     status: active, cuad_origin: null,                          description: "Both parties' duty to maintain licensure, accreditation and similar qualifications. Not compliance with law or program eligibility (see compliance_with_laws)." }
  - { id: limitation_of_liability,   label: "Limitation of Liability",       status: active, cuad_origin: "Cap On Liability",             description: "Liability caps and exclusions (often absent; flag if introduced)." }
  - { id: ip_ownership,              label: "IP Ownership Assignment",       status: active, cuad_origin: "Ip Ownership Assignment",     description: "Who owns work product, materials and other intellectual property created in the placement, including assignment of it to a party by a participant who is not a contracting party, such as a student assigning rights to the host or the school." }

  # --- Added from corpus evidence (issue #253): text with no home in the types above ---
  # Each was proposed independently by two raters on text the classifier left
  # unclassified, and kept only with 2+ members; status: custom per the curation rule.
  - { id: compliance_with_laws,      label: "Compliance with Laws & Program Eligibility", status: custom, cuad_origin: null, description: "The parties state, represent or covenant that the arrangement and their performance conform to applicable law, regulation and accreditation requirements, including healthcare fraud-and-abuse and referral rules; a party represents that it is not excluded or otherwise ineligible to take part in government healthcare or payment programs and must notify the other if that changes; cooperation with a party's compliance program; change-in-law or illegality mechanics (suspend, renegotiate or terminate). Not discrimination rules (non_discrimination), privacy statutes (ferpa_student_records, hipaa_phi, data_privacy_security) or licensure and accreditation status (accreditation_licensure)." }
  - { id: student_access_and_removal, label: "Student Site Access & Removal",  status: custom, cuad_origin: null, description: "Which areas, clients and activities of the host site a placed student may access; the host's right to refuse entry to, suspend, or require withdrawal of a student on safety, health, conduct, competence or policy grounds; whether that discretion is sole or reasonable, and any duty to consult or notify the school first. Not refusal that rests on a pre-placement screening result (background_checks), the student's own conduct duties (student_responsibilities) or ending the whole agreement (termination_cause, termination_convenience)." }
  - { id: survival,                  label: "Survival & Effect of Termination", status: custom, cuad_origin: null, description: "Which rights and obligations continue after expiry, non-renewal or termination, and for how long (typically indemnities, confidentiality, records and accrued liabilities), and general statements of what ends on termination. Not the right to terminate or its notice and cure mechanics (termination_cause, termination_convenience) and not severance of an invalid provision (severability)." }
  - { id: student_health_and_safety, label: "Student Health & Safety",        status: custom, cuad_origin: null, description: "Safety and infection-control training (occupational safety, bloodborne pathogens), exposure-incident handling, emergency or urgent care for a student hurt or taken ill on site and who pays for it, and health prerequisites for placement such as immunizations or health clearance. Not health insurance (insurance) and not criminal, drug or identity screening (background_checks)." }
  - { id: program_administration,    label: "Program Administration & Host Operational Control", status: custom, cuad_origin: null, description: "Operating terms of the placement program that are neither student duties nor supervision: the host's discretion over how many students it accepts and when, its retained authority over its own operations and client care, the facilities, space and resources it makes available, the school's right to visit or inspect the site, and periodic joint review and coordination meetings on the affiliation. Not day-to-day supervision and grading (supervision_evaluation), student duties (student_responsibilities), or financial audit and purchase-volume commitments (audit_rights and minimum_commitment, which stay inactive)." }

  # --- Inactive: CUAD categories not material to this agreement type (kept for upgrades) ---
  - { id: most_favored_nation,       label: "Most Favored Nation",           status: inactive, cuad_origin: "Most Favored Nation",        description: "Not applicable to affiliation agreements." }
  - { id: non_compete,               label: "Non-Compete",                   status: inactive, cuad_origin: "Non-Compete",                description: "Superseded by Non-Exclusive; flag if a true non-compete appears." }
  - { id: exclusivity,               label: "Exclusivity",                   status: inactive, cuad_origin: "Exclusivity",                description: "Agreements are expressly non-exclusive; a statement that the parties may deal with others is filed under relationship_of_parties." }
  - { id: license_grant,             label: "License Grant",                 status: inactive, cuad_origin: "License Grant",              description: "Not typical." }
  - { id: minimum_commitment,        label: "Minimum Commitment",            status: inactive, cuad_origin: "Minimum Commitment",          description: "Placement counts are discretionary, not committed; host discretion over capacity is filed under program_administration." }
  - { id: price_restrictions,        label: "Price Restrictions",            status: inactive, cuad_origin: "Price Restrictions",          description: "No pricing; no-pay arrangement." }
  - { id: audit_rights,              label: "Audit Rights",                  status: inactive, cuad_origin: "Audit Rights",               description: "Not a financial audit; the site-inspection right is filed under program_administration." }
  - { id: warranty_duration,         label: "Warranty Duration",             status: inactive, cuad_origin: "Warranty Duration",           description: "Not applicable." }
